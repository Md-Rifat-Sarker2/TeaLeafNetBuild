apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.tealeafnet.benchmark'
    compileSdk 34

    defaultConfig {
        applicationId "com.tealeafnet.benchmark"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Don't let Gradle compress the .tflite file — TFLite needs to
    // memory-map it directly from the APK/assets
    androidResources {
        noCompress 'tflite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
